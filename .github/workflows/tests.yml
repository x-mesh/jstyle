name: tests

# 기본 검사는 운영체제별로 늘 실행합니다.
# 운영체제·브라우저에 따라 동작이 달라지는 캡처·탐색기 도구가 바뀌면 브라우저 검사를 모두 돌리고,
# 키트와 패턴 라이브러리만 바뀌면 Linux Chrome 하나로 확인합니다. 전체 브라우저 검사는 매주 한 번 따로 돌립니다.
on:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", "assets/**", "references/**", "SKILL.md", ".github/workflows/tests.yml"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select_browser.outputs.full }}
      quick: ${{ steps.select_browser.outputs.quick }}
    steps:
      - name: 줄바꿈 유지
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select_browser
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # 브라우저 테스트는 scripts/, 이 세 테스트 파일과 공용 PNG 도구, 탐색기 원본, 글꼴, 마크 파일을 읽습니다.
          full='^(scripts/|bin/|tests/(test_(shoot|build_explorer|prep_image)\.mjs|png-fixture\.mjs)$|assets/(style-explorer\.html$|fonts/|jstyle-mark\.svg$)|\.github/workflows/tests\.yml$)'
          quick='^(assets/|tests/)'
          case "$EVENT" in
            schedule|workflow_dispatch)
              echo "full=1" >> "$GITHUB_OUTPUT"; exit 0 ;;
            pull_request)
              changed=$(git diff --name-only origin/main...HEAD) ;;
            *)
              # 새 브랜치나 강제 push는 비교할 이전 커밋이 없으므로 모두 실행합니다.
              if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then echo "full=1" >> "$GITHUB_OUTPUT"; exit 0; fi
              changed=$(git diff --name-only "$BEFORE" HEAD) ;;
          esac
          if grep -qE "$full" <<< "$changed"; then
            echo "full=1" >> "$GITHUB_OUTPUT"
          elif grep -qE "$quick" <<< "$changed"; then
            echo "quick=1" >> "$GITHUB_OUTPUT"
          fi

  core:
    name: ${{ matrix.os }} · 기본 검사
    needs: select
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 줄바꿈 유지
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 기본 검사
        run: node --test tests/test_html_parser.mjs tests/test_measure_reference.mjs tests/test_cli.mjs tests/test_curate_media.mjs tests/test_workdir.mjs tests/test_extension_resources.mjs tests/test_recommend_once.mjs

  quick:
    name: linux · chrome · 키트와 패턴
    needs: select
    if: needs.select.outputs.quick == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 줄바꿈 유지
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 한글 글꼴과 Chrome 샌드박스 준비
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: 키트와 패턴 검사
        run: node --test tests/test_extended_patterns.mjs tests/test_kit.mjs

  browser:
    name: ${{ matrix.name }}
    needs: select
    if: needs.select.outputs.full == '1'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "linux · chrome", os: ubuntu-latest }
          - { name: "windows · chrome · 어두운 테마", os: windows-latest, theme: dark, node: 24 }
          - { name: "windows · edge", os: windows-latest, browser: edge }
    env:
      # CI의 두 코어와 소프트웨어 그리기는 0.36초 반응을 놓칠 수 있어 해당 실시간 검사는 로컬에서만 합니다.
      JSTYLE_SHOOT_SLOW_HOST: "1"
    steps:
      - name: 줄바꿈 유지
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node || 22 }}
      - name: Linux：ffmpeg 설치와 Chrome 샌드박스 준비
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-cjk
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Windows：ffmpeg 설치
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Windows：시스템을 어두운 테마로 바꾸기
        if: matrix.theme == 'dark'
        shell: pwsh
        run: |
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name AppsUseLightTheme -Value 0 -Type DWord
          Set-ItemProperty -Path $key -Name SystemUsesLightTheme -Value 0 -Type DWord
      - name: Windows：Edge 사용
        if: matrix.browser == 'edge'
        shell: pwsh
        run: |
          $edge = @("${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe", "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { throw "Edge를 찾을 수 없습니다" }
          "CHROME_PATH=$edge" >> $env:GITHUB_ENV
          Write-Output "Edge $((Get-Item $edge).VersionInfo.ProductVersion)"
      - name: 브라우저 검사 실행
        run: node --test tests/test_build_explorer.mjs tests/test_prep_image.mjs tests/test_shoot.mjs
      - name: 키트와 패턴 검사
        run: node --test tests/test_extended_patterns.mjs tests/test_kit.mjs
      - name: Windows：남은 브라우저 프로세스 확인
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $left = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -and $_.CommandLine.Contains('jstyle-shoot-') -and $_.CommandLine.Contains('user-data-dir') })
          $left | Select-Object ProcessId, Name | Format-Table
          if ($left.Count) { throw "남은 개수: $($left.Count)개 브라우저 프로세스가 끝나지 않았습니다" }
