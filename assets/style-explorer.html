/* 나란히 보기와 한 장 보기 사이、화면 크기가 바뀔 때 페이지 전환을 씁니다：같은 안이 카드에서 한 장 보기로 커집니다，다른 카드는 흐려집니다，사이드바가 오른쪽에서 들어옵니다 */
::view-transition-group(*){animation-duration:var(--glide-d);animation-timing-function:var(--glide)}
::view-transition-old(*),::view-transition-new(*){height:100%;object-fit:cover;object-position:50% 0}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both}
::view-transition-new(*):only-child{animation:vt-in .3s .08s ease-out both}
::view-transition-new(info):only-child{animation:info-in var(--glide-d) var(--glide) both}
::view-transition-old(info):only-child{animation:info-out .22s var(--exit) both}
::view-transition-old(bar){display:none}::view-transition-new(bar){animation:none}
/* 크기와 배율은 모양과 위치만 바꿉니다：바깥 모양을 직접 바꿉니다，내용을 겹쳐 보이지 않습니다 */

html[data-vt=reshape]::view-transition-new(*){animation:none}
html[data-vt=reshape]::view-transition-old(*):only-child{animation:vt-out .18s var(--exit) both;opacity:1}

  add.addEventListener('click',()=>{const note=box.value.trim();if(!note){box.focus();return;}comments.push({id:p.id,element:p.element,note,kind:pending.kind});fresh=comments.length-1;folded=false;closeBubble();syncFrames();renderPanel();});
  cancel.addEventListener('click',closeBubble);
  row.append(cancel,add);b.replaceChildren(title,kinds,box,row);b.hidden=false;placeBubble();box.focus();
 }
 function closeBubble(){pending=null;const b=$('#bubble');b.hidden=true;b.replaceChildren();}
 window.addEventListener('scroll',placeBubble,{capture:true,passive:true});window.addEventListener('resize',placeBubble,{passive:true});
 // The panel's width changes the board's room, so a fitted board refits after it.
 const relayout=()=>requestAnimationFrame(()=>{if(st.layout==='compare')sizeCards();fitAll();});
 // The review panel sits beside both views. Without a server it only shows the open direction.
 const panelShown=()=>REVIEW||st.layout==='loupe';
 function layoutPanel(){
  const p=$('#panel'),on=panelShown();p.hidden=!on;p.toggleAttribute('data-folded',folded);
  root.style.setProperty('--panel-w',on?(folded?'48px':'var(--panel-open)'):'0px');
  const f=$('#panel-fold');f.textContent=folded?'‹':'›';f.title=folded?t('panelUnfold'):t('panelFold');f.setAttribute('aria-label',f.title);f.setAttribute('aria-expanded',String(!folded));
  $('#info-body').hidden=st.layout!=='loupe';
 }
 function renderPanel(){
  layoutPanel();
  const sum=$('#panel-sum'),review=$('#review'),foot=$('#panel-foot');
  sum.replaceChildren();review.replaceChildren();foot.replaceChildren();review.hidden=foot.hidden=!REVIEW;
  paintHint();
  if(!REVIEW){relayout();return;}
  const total=el('b',null,String(comments.length));total.toggleAttribute('data-empty',!comments.length);sum.append(total,el('span',null,t('comments')));
  const count=$('#comment-mode .count');count.textContent=String(comments.length);count.hidden=!comments.length;
  $$('#film button[data-id]').forEach(b=>{b.querySelector('.fc').textContent=String(comments.filter(x=>x.id===b.dataset.id).length||'');});
  const only=$('#film .film-send');if(only)only.disabled=!comments.length&&!notes.trim();
  if(!comments.length)review.append(el('p','rv-empty',t('noComments')));
  const order=st.layout==='loupe'?[byId[st.current],...C.filter(c=>c.id!==st.current)]:C;
  for(const c of order){
   const mine=comments.map((x,i)=>({x,i})).filter(({x})=>x.id===c.id);if(!mine.length)continue;
   const g=el('section','rv-group'),ol=el('ol');g.toggleAttribute('data-current',st.layout==='loupe'&&c.id===st.current);g.append(el('h4',null,`${no(c)} ${c.name}`));
   for(const {x,i} of mine){
    const li=el('li'),what=el('button','what'),rm=el('button','rm',t('removeComment'));
    what.type=rm.type='button';what.append(el('code',null,x.element.label),document.createTextNode(x.note));
    what.addEventListener('click',()=>{if(st.layout==='loupe')go(c.id);else setLayout('loupe',c.id);});
    const k=el('span','k',(x.kind==='keep'?t('kindKeep'):t('kindChange')));k.dataset.kind=x.kind;
    rm.addEventListener('click',()=>{comments.splice(i,1);syncFrames();renderPanel();});
    li.append(el('span','n',String(i+1)),k,what,rm);if(i===fresh)li.classList.add('fresh');ol.append(li);
   }
   g.append(ol);review.append(g);
  }
  const label=el('label','notes'),box=el('textarea');box.value=notes;box.placeholder=t('notesPlaceholder');box.maxLength=4000;
  const sendB=el('button','pick',t('sendFeedback'));sendB.type='button';sendB.title=t('sendFeedbackTitle');
  const ready=()=>{sendB.disabled=!comments.length&&!notes.trim()&&!st.chosen;};
  box.addEventListener('input',()=>{notes=box.value;ready();const only=$('#film .film-send');if(only)only.disabled=!comments.length&&!notes.trim();});
  label.append(el('span',null,t('notesLabel')),box);review.append(label);
  const mode=el('button','comment-toggle');mode.type='button';mode.setAttribute('aria-pressed',String(commenting));mode.append(...commentLabel());mode.addEventListener('click',()=>setCommenting(!commenting));
  const copyB=el('button',TOKEN?'tool copy-msg':'pick copy-msg',t('copyForAgent'));copyB.type='button';copyB.title=t('copyForAgentTitle');copyB.addEventListener('click',()=>copy(agentMessage()));
  ready();sendB.addEventListener('click',()=>send());foot.append(mode,...(TOKEN?[sendB]:[]),copyB);
  if(fresh>=0){$('#review li.fresh')?.scrollIntoView({block:'nearest'});fresh=-1;}
  relayout();
 }
 document.addEventListener('keydown',e=>{
  if(!REVIEW||e.target.closest?.('textarea,input')||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key.toLowerCase()==='c'){e.preventDefault();setCommenting(!commenting);}
  else if(e.key==='Escape'&&(pending||commenting)){e.stopImmediatePropagation();if(pending)closeBubble();else setCommenting(false);}
 });
 function toggleZoom(){
  morph(()=>{zoomActual=!zoomActual;const sl=$('.slide.is-current');sl.dataset.zoom=zoomActual?'actual':'fit';fitAll();sl.scrollTo(0,0);const z=$('#zoom');z.textContent=zoomActual?t('fit'):t('actual');z.setAttribute('aria-pressed',String(zoomActual));},'reshape');
 }

 function render(){
  const list=shown(),loupe=st.layout==='loupe'&&list.length>0;
  $('#compare-view').hidden=st.layout!=='compare'||!list.length;$('#loupe').hidden=!loupe;$('#dock').hidden=st.layout!=='compare'||!list.length;
  syncCompare();syncLoupe(0);
  $$('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===st.layout)));
  $$('[data-viewport]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.viewport===st.viewport)));
  placeThumbs(false);placeFilm(true);
  renderPanel();paintChoice();fitAll();
 }
 function setLayout(layout,id){
  if(layout===st.layout&&!(id&&id!==st.current))return;
  const board=$('#compare-view');if(layout==='loupe'&&st.layout==='compare')compareScroll={x:board.scrollLeft,y:board.scrollTop};
  closeBubble();
  if(id)st.current=id;st.layout=layout;zoomActual=false;save();
  morph(()=>{
   render();
   if(layout==='loupe'){window.scrollTo(0,0);return;}
   sizeCards();fitAll();
   if(compareScroll)board.scrollTo(compareScroll.x,compareScroll.y);
   const a=$(`.card[data-id="${CSS.escape(st.current)}"]`),r=a?.getBoundingClientRect(),v=board.getBoundingClientRect();
   if(r&&(r.left<v.left||r.right>v.right||r.top<v.top||r.bottom>v.bottom))a.scrollIntoView({block:'nearest',inline:'center'});
  });
 }
 function go(id){
  const list=shown(),from=list.findIndex(c=>c.id===st.current),to=list.findIndex(c=>c.id===id);
  if(to<0||to===from)return;
  closeBubble();st.current=id;zoomActual=false;save();syncLoupe(Math.sign(to-from));fitAll();
 }
 function step(d){const list=shown(),i=list.findIndex(c=>c.id===st.current),n=list[i+d];if(n)go(n.id);else nudge(d);}
 function nudge(d){animate($('.slide.is-current .stage'),[{transform:'none'},{transform:`translateX(${d*14}px)`},{transform:'none'}],{duration:320,easing:'ease-out'});}

 // 고르면 복사합니다：다시 누르기“고름”이 안을 다시 복사
 function choose(id){
  const fresh=st.chosen!==id;st.chosen=id;save();paintChoice();
  if(fresh){
   animate($(`.card[data-id="${CSS.escape(id)}"] .pick-mark`),[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],{duration:500,easing:ease('pop')});
  }
  if(TOKEN){renderPanel();send();}else copy(comments.length||notes.trim()?agentMessage():copyText());
 }
 function paintChoice(){
  $$('.card').forEach(a=>a.classList.toggle('is-chosen',a.dataset.id===st.chosen));
  $$('[data-pick]').forEach(b=>{const on=b.dataset.pick===st.chosen,short=!!b.closest('.cap');b.replaceChildren(document.createTextNode(on?(short?t('selected'):TOKEN?t('selectedSent'):t('selectedCopy')):(short?t('select'):t('selectDirection'))));if(!short)b.append(el('kbd',null,'P'));b.toggleAttribute('data-on',on);b.title=on?(TOKEN?t('resendTitle'):t('recopyTitle')):(TOKEN?t('sendTitle'):t('selectTitle'));});
  $$('#film button[data-id]').forEach(b=>b.querySelector('.ft').classList.toggle('chosen',b.dataset.id===st.chosen));
 }
 function copyText(){const c=byId[st.chosen];let text=t('copyChoice',{round:DATA.round?t('copyRound',{round:DATA.round}):'',number:no(c),name:c.name});return text;}
 async function copy(t=copyText(),label){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true;}catch{const a=el('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{ok=document.execCommand('copy');}catch{}a.remove();}
  toast(ok,t,ok?label:null);
 }
 // A stopped server (after --wait) or a rejected post falls back to copying, notes included.
 async function send(){
  try{
   const r=await fetch('/__jstyle/choice',{method:'POST',headers:{'Content-Type':'application/json','X-Jstyle-Token':TOKEN},body:JSON.stringify({id:st.chosen??null,notes,viewport:st.viewport,comments:comments.map(x=>({id:x.id,kind:x.kind,note:x.note,element:x.element}))})});
   if(!r.ok)throw new Error(String(r.status));
   const reply=await r.json().catch(()=>({}));
   toast(true,st.chosen?copyText():t('commentCount',{n:comments.length}),reply.waiting?t('sent'):t('savedOnly'));
  }catch{await copy(agentMessage(),t('sendFailed'));}
 }
 // One paste-ready message for the copy button, the send fallback and a file-mode pick.
 function agentMessage(){
  const head=[t('msgHead'),DATA.project,DATA.round?t('msgRound',{round:DATA.round}):''].filter(Boolean).join(' · ');
  const c=st.chosen&&byId[st.chosen],lines=[head,c?t('msgPick',{pick:`${no(c)} ${c.name}`}):t('msgNoPick')];
  if(notes.trim())lines.push(t('msgNotes',{notes:notes.trim()}));
  if(comments.length){
   lines.push('',t('msgComments'));
   comments.forEach((x,i)=>{const d=byId[x.id],text=(x.element.text||'').slice(0,60);
    lines.push(`${i+1}. [${x.kind==='keep'?t('kindKeep'):t('kindChange')}] ${no(d)} ${d.name} — ${x.element.label}`,
     `   ${t('msgWhere',{path:x.element.path+(text?` · "${text}"`:'')})}`,`   ${t('msgNote',{note:x.note})}`);});
  }
  return lines.join('\n');
 }
 // The top hint says comments exist before anyone finds the button; it leaves after the first comment or a close.
 function paintHint(){
  const h=$('#comment-hint');if(!h)return;
  const idle=!commenting&&!comments.length&&!hintClosed&&REVIEW;h.hidden=!(commenting||idle);h.toggleAttribute('data-idle',idle);
  if(h.hidden)return;
  if(!idle){h.replaceChildren(document.createTextNode(t('commentHint')));return;}
  const go=el('button','go');go.type='button';go.append(document.createTextNode(t('discoverHint')),el('kbd',null,'C'));go.addEventListener('click',()=>setCommenting(true));
  const x=el('button','x','×');x.type='button';x.title=t('hintClose');x.setAttribute('aria-label',x.title);
  x.addEventListener('click',()=>{hintClosed=true;try{localStorage.setItem(HINT_KEY,'1');}catch{}paintHint();});
  h.replaceChildren(go,x);
 }
 function toast(ok,text,label){
  const n=$('#toast');n.toggleAttribute('data-fail',!ok);n.querySelector('b').textContent=label||(ok?t('copied'):t('copyFailed'));n.querySelector('code').textContent=ok?text.replace(/\n/g,' · '):text;
  n.classList.remove('show');n.offsetWidth;n.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.classList.remove('show'),ok?2400:8000);
 }

 // Shift+wheel and pinch (ctrl+wheel) zoom the board; macOS turns shift+wheel into deltaX.
 function boardWheel(dx,dy,pinch,x,y){const d=dy||dx;if(!d)return;setZoom(zoom*Math.exp(-d*(pinch?.01:.0015)),x,y);}
 $('#compare-view').addEventListener('wheel',e=>{if(!(e.shiftKey||e.ctrlKey)||narrow())return;e.preventDefault();boardWheel(e.deltaX,e.deltaY,e.ctrlKey,e.clientX,e.clientY);},{passive:false});
 // Dragging empty canvas pans the board; cards keep their own clicks.
 $('#compare-view').addEventListener('pointerdown',e=>{
  if(e.button!==0||narrow()||e.target.closest('.card,.intro p,button,a'))return;
  const v=e.currentTarget,x0=e.clientX,y0=e.clientY,l0=v.scrollLeft,t0=v.scrollTop;v.setPointerCapture(e.pointerId);v.classList.add('panning');
  const move=m=>{v.scrollLeft=l0-(m.clientX-x0);v.scrollTop=t0-(m.clientY-y0);placeBubble();};
  const up=()=>{v.classList.remove('panning');v.removeEventListener('pointermove',move);v.removeEventListener('pointerup',up);v.removeEventListener('pointercancel',up);};
  v.addEventListener('pointermove',move);v.addEventListener('pointerup',up);v.addEventListener('pointercancel',up);
 });
 $('#zoom-in').addEventListener('click',()=>setZoom(zoom*1.25));$('#zoom-out').addEventListener('click',()=>setZoom(zoom/1.25));
 $('#zoom-now').addEventListener('click',()=>setZoom(1));$('#zoom-fit').addEventListener('click',zoomFit);
 document.addEventListener('keydown',e=>{
  if(st.layout!=='compare'||e.target.closest?.('textarea,input')||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='f'){e.preventDefault();zoomFit();}else if(k==='+'||k==='='){e.preventDefault();setZoom(zoom*1.25);}else if(k==='-'||k==='_'){e.preventDefault();setZoom(zoom/1.25);}else if(k==='0'){e.preventDefault();setZoom(1);}
 });
 $$('button[data-layout]').forEach(b=>b.addEventListener('click',()=>setLayout(b.dataset.layout)));
 $$('button[data-viewport]').forEach(b=>b.addEventListener('click',()=>{if(st.viewport===b.dataset.viewport)return;st.viewport=b.dataset.viewport;save();fitting=true;morph(render,'reshape');}));
 // 모든 안에 고정 캔버스가 있으면，넓은 화면과 휴대폰을 바꿔도 달라지지 않습니다，접기。
 if(C.every(c=>c.nativeViewport))$('[data-i18n-aria-label="viewportLabel"]').style.display='none';
 $('#prev').addEventListener('click',()=>step(-1));$('#next').addEventListener('click',()=>step(1));
 document.addEventListener('keydown',e=>{
  if(e.target.closest?.('textarea,input,summary')||e.metaKey||e.ctrlKey||e.altKey||st.layout!=='loupe')return;
  if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);else if(e.key==='Escape')setLayout('compare');else if(e.key.toLowerCase()==='p')choose(st.current);
 });
 function syncBars(){root.style.setProperty('--bar-h',`${$('#bar').offsetHeight}px`);placeThumbs(true);placeFilm(true);if(st.layout==='compare')requestAnimationFrame(()=>{sizeCards();fitAll();});else refit();}
 window.addEventListener('resize',syncBars,{passive:true});
 document.fonts?.ready.then(()=>{placeThumbs(true);placeFilm(true);});
 let tools='dark';try{tools=localStorage.getItem(THEME_KEY)==='light'?'light':'dark';}catch{}
 setTools(tools,false);$('#theme-toggle').addEventListener('click',()=>setTools(root.dataset.tools==='light'?'dark':'light',true));
 $('#bar').hidden=false;
 if(REVIEW){const b=$('#comment-mode');b.append(...commentLabel(),el('span','count'));b.hidden=false;b.addEventListener('click',()=>setCommenting(!commenting));}
 $('#panel-fold').addEventListener('click',()=>{folded=!folded;renderPanel();});
 if(st.layout==='compare'){$('#grid').classList.add('first');$('.intro').classList.add('first');setTimeout(()=>{$('#grid').classList.remove('first');$('.intro').classList.remove('first');},1400);}
 render();syncBars();
 if(services.size){checkServices();setInterval(()=>{if(!document.hidden)checkServices();},5000);window.addEventListener('focus',checkServices);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkServices();});}
})();
</script></body></html>
